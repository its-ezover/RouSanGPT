# Runs the app's own tests on Linux: the inner parts (tests/test_backend.py) and the
# web page in a real browser (tests/ui_test.py: drag and drop, uploads, chats, both
# themes). Also every Monday, so a new package release that breaks the app shows up.
name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Inner parts
        run: python tests/test_backend.py

      - name: The web page in a browser
        run: python tests/ui_test.py --shots screenshots

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
