# Runs the real Windows installer on a fresh Windows machine, starts the app, updates
# it while it runs, and uninstalls it. It checks everything the installer promises.
name: Windows install

on:
  push:
    paths:
      - "install.*"
      - "uninstall.*"
      - "*.py"
      - "requirements.txt"
      - "web/**"
      - ".github/workflows/windows-install.yml"
  pull_request:
  schedule:
    - cron: "0 6 * * 1"         # every Monday: catches a new package release that breaks the install
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: What the machine has
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          Get-Command winget, py, python, ffmpeg, dot -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize
          winget --version

      - name: Install (install.cmd -Yes -DesktopShortcut, Windows PowerShell 5.1)
        shell: cmd
        run: call install.cmd -Yes -DesktopShortcut < NUL

      - name: Check what was installed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "RouSanGPT"
          $fail = 0
          function Check($what, $ok) { if ($ok) { "PASS  $what" } else { "FAIL  $what"; $script:fail++ } }
          Check "program copied" (Test-Path "$root\app\launcher.py")
          Check "web page copied" (Test-Path "$root\app\web\index.html")
          Check "icon copied" (Test-Path "$root\app\icons\rousangpt.ico")
          Check "pythonw.exe in the environment" (Test-Path "$root\venv\Scripts\pythonw.exe")
          Check "console helper" (Test-Path "$root\rousangpt-console.cmd")
          Check "data folder" (Test-Path "$root\data")
          $shell = New-Object -ComObject WScript.Shell
          foreach ($lnk in @((Join-Path ([Environment]::GetFolderPath("Programs")) "RouSanGPT.lnk"),
                             (Join-Path ([Environment]::GetFolderPath("Desktop")) "RouSanGPT.lnk"))) {
            Check "shortcut $lnk" (Test-Path $lnk)
            if (Test-Path $lnk) {
              $s = $shell.CreateShortcut($lnk)
              Check "  runs pythonw.exe ($($s.TargetPath))" ($s.TargetPath -like "*\venv\Scripts\pythonw.exe" -and (Test-Path $s.TargetPath))
              Check "  starts launcher.py with --data-dir ($($s.Arguments))" ($s.Arguments -like "*launcher.py*--data-dir*")
            }
          }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RouSanGPT"
          Check "listed in Settings > Apps" (Test-Path $key)
          if ($fail) { exit 1 }

      - name: FFmpeg and Graphviz work from the app
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $root = Join-Path $env:LOCALAPPDATA "RouSanGPT"
          $env:ROUSANGPT_DATA_DIR = "$root\data"
          @'
          import os, subprocess, sys
          sys.path.insert(0, sys.argv[1])
          import binaries
          ffmpeg, dot = binaries.find_tool("ffmpeg"), binaries.find_tool("dot")
          print("ffmpeg:", ffmpeg)
          print("dot:", dot)
          assert ffmpeg and dot, "a program was not found"
          binaries.run_ffmpeg(["-f", "lavfi", "-i", "sine=duration=1", "tone.wav"])
          assert os.path.getsize("tone.wav") > 1000
          r = subprocess.run([dot, "-Tpng", "-o", "g.png"], input="digraph { A -> B }",
                             capture_output=True, text=True)
          assert r.returncode == 0, r.stderr
          assert os.path.getsize("g.png") > 100
          print("ffmpeg and Graphviz work")
          '@ | Set-Content tools_test.py
          & "$root\venv\Scripts\python.exe" -X utf8 tools_test.py "$root\app"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Start the app, use it, update it while it runs, quit
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA "RouSanGPT"
          $log = Join-Path $env:RUNNER_TEMP "app.log"
          function Start-App {
            Start-Process -FilePath "$root\venv\Scripts\python.exe" -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err" `
              -ArgumentList @("-X", "utf8", "`"$root\app\launcher.py`"", "--data-dir", "`"$root\data`"", "--no-window", "--console")
          }
          function Wait-Status($seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try {
                $port = (Get-Content "$root\data\server.json" -Raw | ConvertFrom-Json).port
                $s = Invoke-RestMethod "http://127.0.0.1:$port/api/status" -TimeoutSec 3
                if ($s.app -eq "RouSanGPT") { return $port }
              } catch { }
              Start-Sleep 1
            }
            return $null
          }
          function Show-Log { Get-Content $log, "$log.err" -ErrorAction SilentlyContinue }

          $p = Start-App
          $port = Wait-Status 300
          if (-not $port) { "FAIL  the app did not answer"; Show-Log; exit 1 }
          "PASS  the app answers on port $port"
          $chat = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/chats"
          if (-not $chat.id) { "FAIL  could not create a chat"; Show-Log; exit 1 }
          "PASS  created chat $($chat.id)"
          $page = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
          if ($page.StatusCode -ne 200) { "FAIL  the web page"; exit 1 }
          "PASS  the web page loads"

          # Add a course file the way the page does (upload, then wait for the result)
          $txt = Join-Path $env:RUNNER_TEMP "ci-notes.txt"
          Set-Content $txt "TCP opens a connection with a three-way handshake: SYN, SYN-ACK, ACK." -Encoding utf8
          $job = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/materials" -Form @{ file = Get-Item $txt }
          $r = $null
          for ($i = 0; $i -lt 40; $i++) {
            $r = Invoke-RestMethod "http://127.0.0.1:$port/api/result/$($job.job_id)?wait=15" -TimeoutSec 30
            if ($r.status -ne "working") { break }
          }
          if ($r.status -ne "done") { "FAIL  adding a course file: $($r | ConvertTo-Json -Compress)"; Show-Log; exit 1 }
          "PASS  added a course file ($($r.pieces) pieces)"
          $m = Invoke-RestMethod "http://127.0.0.1:$port/api/materials"
          if (-not ($m | Where-Object name -eq "ci-notes.txt")) { "FAIL  the file is not in the materials list"; exit 1 }
          "PASS  the file is in the materials list"

          # Update while the app runs: the installer must close it first
          cmd /c "call install.cmd -Yes < NUL"
          if ($LASTEXITCODE -ne 0) { "FAIL  updating while the app runs"; exit 1 }
          if (-not $p.WaitForExit(30000)) { "FAIL  the installer did not close the running app"; Show-Log; exit 1 }
          "PASS  the installer closed the running app and updated it"
          if (-not (Test-Path "$root\data\chats.db")) { "FAIL  the update lost the chats"; exit 1 }
          "PASS  data kept after the update"

          # Start again and quit
          $p = Start-App
          $port = Wait-Status 180
          if (-not $port) { "FAIL  the app did not start after the update"; Show-Log; exit 1 }
          "PASS  the app starts after the update"
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/quit" | Out-Null
          if (-not $p.WaitForExit(30000)) { "FAIL  Quit did not stop the app"; Show-Log; exit 1 }
          if (Test-Path "$root\data\server.json") { "FAIL  server.json left behind"; exit 1 }
          "PASS  Quit stops the app"
          Show-Log

      - name: Uninstall
        shell: cmd
        run: call uninstall.cmd < NUL

      - name: Check the uninstall
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA "RouSanGPT"
          $fail = 0
          function Check($what, $ok) { if ($ok) { "PASS  $what" } else { "FAIL  $what"; $script:fail++ } }
          Check "program removed" (-not (Test-Path "$root\app"))
          Check "environment removed" (-not (Test-Path "$root\venv"))
          Check "download cache removed" (-not (Test-Path "$root\uv-cache"))
          Check "Start menu shortcut removed" (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "RouSanGPT.lnk")))
          Check "desktop shortcut removed" (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "RouSanGPT.lnk")))
          Check "removed from Settings > Apps" (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RouSanGPT"))
          Check "data kept" (Test-Path "$root\data\chats.db")
          if ($fail) { exit 1 }

      - name: App log (when something failed)
        if: failure()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\RouSanGPT\data\logs\*.log" -ErrorAction SilentlyContinue
