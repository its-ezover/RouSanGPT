<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RouSanGPT</title>
<link rel="icon" type="image/png" href="/static/logo-mark.png">
<script>
  // apply the saved theme before the page paints (no flash)
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  /* ---------- Theme ---------- */
  :root {
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef0f4; --surface-3:#e4e7ec;
    --border:#e2e5ea; --text:#15181d; --muted:#667085; --accent:#0284c7; --accent-2:#0ea5e9;
    --on-accent:#ffffff; --user:#0284c7; --on-user:#ffffff; --code:#f1f3f6;
    --danger:#dc2626; --ok:#16a34a; --err:#dc2626; --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    --radius:14px; color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1117; --surface:#151a21; --surface-2:#1c222b; --surface-3:#262d38;
      --border:#29303b; --text:#e6e9ee; --muted:#98a2b3; --accent:#38bdf8; --accent-2:#7dd3fc;
      --on-accent:#062030; --user:#1e3a52; --on-user:#e6f4ff; --code:#0b0f14;
      --danger:#ef4444; --ok:#4ade80; --err:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1117; --surface:#151a21; --surface-2:#1c222b; --surface-3:#262d38;
    --border:#29303b; --text:#e6e9ee; --muted:#98a2b3; --accent:#38bdf8; --accent-2:#7dd3fc;
    --on-accent:#062030; --user:#1e3a52; --on-user:#e6f4ff; --code:#0b0f14;
    --danger:#ef4444; --ok:#4ade80; --err:#f87171; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  /* ---------- Base ---------- */
  * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--surface-3) transparent; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  body { margin:0; height:100dvh; background:var(--bg); color:var(--text);
         font:15px/1.5 Inter, system-ui, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
         -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:var(--text); background:var(--surface-2); border:1px solid transparent;
           border-radius:10px; padding:8px 14px; cursor:pointer; transition:background .15s, border-color .15s, opacity .15s; }
  button:hover { background:var(--surface-3); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }
  select { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border);
           border-radius:10px; padding:7px 10px; cursor:pointer; }
  svg { width:18px; height:18px; flex-shrink:0; }
  .ico { display:inline-flex; align-items:center; justify-content:center; padding:8px; background:none;
         color:var(--muted); border-radius:10px; }
  .ico:hover { background:var(--surface-2); color:var(--text); }
  .hidden { display:none !important; }

  #app { display:flex; height:100dvh; }
  #app.collapsed #side { display:none; }

  /* ---------- Sidebar ---------- */
  #side { width:280px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
          display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:10px; padding:14px 14px 10px; }
  .logo { width:36px; height:36px; object-fit:contain; flex-shrink:0; }
  .brand b { font-size:1.02rem; letter-spacing:-.01em; }
  .brand small { display:block; color:var(--muted); font-size:.78rem; margin-top:-2px; }
  .brand .ico { margin-left:auto; }
  #newChat { margin:4px 12px 10px; display:flex; align-items:center; justify-content:center; gap:8px;
             background:var(--accent); color:var(--on-accent); font-weight:600; border-radius:12px; padding:10px; }
  #newChat:hover { filter:brightness(1.08); background:var(--accent); }
  .search { margin:0 12px 8px; position:relative; }
  .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); width:16px; height:16px; }
  #search { width:100%; padding:8px 10px 8px 32px; border-radius:10px; border:1px solid var(--border);
            background:var(--bg); color:var(--text); font:inherit; font-size:.9rem; }
  .list-label { padding:6px 18px 4px; font-size:.72rem; font-weight:600; letter-spacing:.06em;
                text-transform:uppercase; color:var(--muted); }
  #list { flex:1; overflow-y:auto; padding:0 8px 12px; }
  .item { display:flex; align-items:center; gap:2px; padding:8px 10px; border-radius:10px;
          cursor:pointer; color:var(--muted); font-size:.92rem; }
  .item:hover { background:var(--surface-2); color:var(--text); }
  .item.active { background:var(--surface-2); color:var(--text); font-weight:500; }
  .item .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .act { visibility:hidden; background:none; padding:3px 6px; font-size:.85rem; color:var(--muted); border-radius:6px; }
  .item .act:hover { background:var(--surface-3); color:var(--text); }
  .item:hover .act, .item.active .act { visibility:visible; }
  .empty-list { color:var(--muted); font-size:.88rem; padding:10px; text-align:center; }
  #side .bottom { padding:8px; border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:4px; }
  #side .bottom button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
                          background:none; color:var(--muted); font-size:.78rem; padding:8px 4px; min-width:0;
                          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #side .bottom button svg { width:20px; height:20px; }
  #side .bottom button:hover { background:var(--surface-2); color:var(--text); }
  /* while the tutor is answering, other chats cannot be opened */
  #list.locked .item:not(.active) { opacity:.38; cursor:not-allowed; }
  #list.locked .item:not(.active):hover { background:none; color:var(--muted); }
  #list.locked .item .act { visibility:hidden; }
  #newChat:disabled { filter:grayscale(.6); }
  #scrim { display:none; }

  /* ---------- Main ---------- */
  main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
  header { height:56px; padding:0 12px; display:flex; align-items:center; gap:8px;
           border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--bg) 85%, transparent);
           backdrop-filter:blur(8px); }
  #chatTitle { font-weight:600; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .head-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
  #backend { max-width:260px; font-size:.88rem; }
  .sun { display:none; }
  :root[data-theme="dark"] .sun { display:block; } :root[data-theme="dark"] .moon { display:none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sun { display:block; } :root:not([data-theme="light"]) .moon { display:none; }
  }

  #chat { flex:1; overflow-y:auto; padding:24px 16px 8px; scroll-behavior:smooth; }
  #chat > * { max-width:780px; margin-left:auto; margin-right:auto; }

  /* Messages */
  .turn { display:flex; margin-bottom:22px; }
  .turn.user { justify-content:flex-end; }
  .msg { overflow-wrap:anywhere; line-height:1.65; min-width:0; }
  .user .msg { max-width:min(620px, 88%); background:var(--user); color:var(--on-user); padding:10px 16px;
               border-radius:18px 18px 4px 18px; white-space:pre-wrap; }
  .turn.bot { gap:12px; align-items:flex-start; }
  .avatar { width:32px; height:32px; border-radius:10px; flex-shrink:0; margin-top:1px; padding:3px;
            background:var(--surface); border:1px solid var(--border); object-fit:contain; }
  .bot .msg { flex:1; }
  .msg > p:first-child { margin-top:0; }
  .msg p { margin:.5em 0; } .msg ul, .msg ol { margin:.5em 0; padding-left:1.4em; }
  .msg li { margin:.2em 0; }
  .msg h4 { margin:1em 0 .3em; font-size:1rem; }
  pre { background:var(--code); border:1px solid var(--border); padding:12px 14px; border-radius:10px;
        overflow-x:auto; font-size:.88rem; line-height:1.5; }
  code { font-family:ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; background:var(--surface-2);
         padding:1px 6px; border-radius:6px; font-size:.9em; }
  pre code { padding:0; background:none; font-size:inherit; }
  a { color:var(--accent); }
  .msg img, .msg video { display:block; max-width:100%; border-radius:12px; margin-top:12px;
                         border:1px solid var(--border); }
  .msg img { background:#fff; }
  .msg video { background:#000; }
  .msg details { margin-top:10px; color:var(--muted); font-size:.88rem; }
  .msg details summary { cursor:pointer; width:fit-content; }
  .msg details ul { margin:.4em 0; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .pill { font-size:.76rem; color:var(--muted); background:var(--surface-2); border-radius:999px; padding:3px 10px; }
  .tools { font-size:.8rem; color:var(--muted); }
  .actions { display:flex; gap:4px; margin-top:8px; }
  .actions button { display:inline-flex; align-items:center; gap:6px; background:none; color:var(--muted);
                    font-size:.82rem; padding:5px 9px; border-radius:8px; }
  .actions button:hover { background:var(--surface-2); color:var(--text); }
  .actions svg { width:15px; height:15px; }
  .chip { display:inline-block; margin:8px 6px 0 0; padding:6px 13px; border-radius:999px;
          background:var(--surface); border:1px solid var(--border); font-size:.88rem; cursor:pointer; color:var(--text); }
  .chip:hover { border-color:var(--accent); background:var(--surface); }

  .waiting { color:var(--muted); display:flex; align-items:center; gap:10px; font-size:.92rem; padding-top:4px; }
  .dots { display:inline-flex; gap:4px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity:.25; transform:translateY(0); } 40% { opacity:1; transform:translateY(-4px); } }

  /* Welcome screen */
  .hero { text-align:center; padding:6vh 0 20px; }
  .hero-logo { display:block; width:150px; max-width:50%; height:auto; margin:0 auto 18px; }
  .hero h2 { margin:0 0 6px; font-size:1.6rem; letter-spacing:-.02em; }
  .hero p { margin:0 auto; color:var(--muted); max-width:520px; }
  .suggest { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:28px; text-align:left; }
  .suggest button { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
                    padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:3px; }
  .suggest button:hover { border-color:var(--accent); background:var(--surface); box-shadow:var(--shadow); }
  .suggest b { font-size:.92rem; font-weight:600; }
  .suggest span { font-size:.84rem; color:var(--muted); }

  /* Composer */
  .composer-wrap { padding:8px 16px 14px; }
  #status { max-width:780px; margin:0 auto 6px; min-height:1.3em; color:var(--accent); font-size:.86rem; padding:0 6px; }
  #bar { max-width:780px; margin:0 auto; background:var(--surface); border:1px solid var(--border);
         border-radius:20px; box-shadow:var(--shadow); padding:8px 8px 8px 16px; transition:border-color .15s; }
  #bar:focus-within { border-color:var(--accent); }
  #input { width:100%; resize:none; max-height:200px; padding:8px 0 6px; border:0; background:none;
           color:var(--text); font:inherit; outline:none; }
  #input:focus-visible { outline:none; }
  .bar-row { display:flex; align-items:center; gap:6px; }
  #lang { border:0; background:var(--surface-2); font-size:.85rem; padding:6px 10px; border-radius:999px; }
  .bar-row .spacer { flex:1; }
  #mic { color:var(--muted); background:none; padding:8px; border-radius:50%; display:inline-flex; }
  #mic:hover { background:var(--surface-2); color:var(--text); }
  #mic.rec { background:var(--danger); color:#fff; animation:pulse 1.2s infinite; }
  #send { background:var(--accent); color:var(--on-accent); width:38px; height:38px; padding:0; border-radius:50%;
          display:inline-flex; align-items:center; justify-content:center; }
  #send:hover { filter:brightness(1.08); background:var(--accent); }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--danger) 25%, transparent); } }
  .hint { max-width:780px; margin:6px auto 0; text-align:center; font-size:.75rem; color:var(--muted); }

  /* ---------- Pop-up panels (Materials, Tools) ---------- */
  #modal { position:fixed; inset:0; background:rgba(8,12,18,.55); backdrop-filter:blur(3px); display:flex;
           align-items:center; justify-content:center; z-index:50; padding:16px; animation:fade .15s; }
  .panel { background:var(--surface); width:min(800px, 100%); max-height:90dvh; overflow-y:auto;
           border-radius:18px; border:1px solid var(--border); box-shadow:var(--shadow); padding:0 22px 20px;
           animation:rise .18s ease-out; }
  @keyframes fade { from { opacity:0; } } @keyframes rise { from { transform:translateY(8px); opacity:0; } }
  .phead { display:flex; align-items:center; justify-content:space-between; position:sticky; top:0;
           background:var(--surface); padding:16px 0 10px; z-index:1; }
  .phead h2 { margin:0; font-size:1.15rem; letter-spacing:-.01em; }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin:12px 0; }
  .card > b:first-child { display:block; margin-bottom:4px; }
  .card summary { cursor:pointer; font-weight:600; }
  .muted { color:var(--muted); font-size:.88rem; }
  .row { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .row .grow { flex:1; overflow-wrap:anywhere; }
  .field { display:block; margin:10px 0; }
  .field span { display:block; font-size:.82rem; font-weight:500; color:var(--muted); margin-bottom:4px; }
  .field input, .field textarea, .prow input { width:100%; padding:9px 11px; border-radius:10px;
           border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; }
  .field textarea { resize:vertical; }
  .field input:disabled { opacity:.6; }
  input[type="file"] { font:inherit; font-size:.88rem; color:var(--muted); max-width:100%; }
  input[type="file"]::file-selector-button { font:inherit; border:1px solid var(--border); background:var(--surface);
           color:var(--text); border-radius:8px; padding:6px 12px; margin-right:10px; cursor:pointer; }
  .small { padding:6px 12px; font-size:.85rem; }
  .danger { background:none; color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
  .danger:hover { background:color-mix(in srgb, var(--danger) 12%, transparent); }
  .prow { display:grid; grid-template-columns:80px 1fr 150px; gap:8px; align-items:center; margin:6px 0; }
  .prow b { overflow-wrap:anywhere; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:10px 0 4px; }
  .chips .chip { margin:0; }
  .ok { color:var(--ok); }
  .primary { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .primary:hover { background:var(--accent); filter:brightness(1.08); }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  .btnrow select { flex:1; min-width:0; }
  .card select { max-width:100%; }
  .field select { width:100%; }
  .card.inner { background:var(--surface); margin:10px 0; }
  .card.inner select { width:100%; margin-top:6px; }
  .kv { display:flex; gap:10px; padding:4px 0; font-size:.9rem; flex-wrap:wrap; }
  .kv .muted { min-width:130px; }
  .progress { height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin:8px 0 2px; }
  .progress i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  .setup { position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; align-items:center;
           justify-content:center; padding:16px; overflow-y:auto; }
  .setup-card { width:min(520px, 100%); background:var(--surface); border:1px solid var(--border);
                border-radius:20px; box-shadow:var(--shadow); padding:26px 28px; }
  .setup-card h2 { margin:0 0 6px; text-align:center; letter-spacing:-.02em; }
  .setup-card > p { text-align:center; margin:0 0 10px; }
  .steps { padding-left:1.3em; line-height:1.7; margin:12px 0; }
  .bye { height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
         color:var(--muted); text-align:center; padding:16px; }
  .bye img { width:72px; } .bye h2 { color:var(--text); margin:8px 0 0; }
  .err { color:var(--err); }

  /* ---------- Adding course files: drop zone, upload list, whole-window drop ---------- */
  .drop { display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:10px; padding:22px 16px;
          border:2px dashed var(--border); border-radius:var(--radius); background:var(--surface);
          text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop:hover, .drop:focus-visible { border-color:var(--accent); outline:none; }
  .drop.over { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .drop svg { width:30px; height:30px; color:var(--accent); margin-bottom:4px; }
  .drop b { font-size:.95rem; }
  .drop u { color:var(--accent); text-underline-offset:2px; }
  .drop .muted { font-size:.8rem; }
  .uploads { margin-top:10px; }
  .uploads .row { gap:10px; }
  .uploads .grow { min-width:0; }
  .uploads .state { flex-shrink:0; max-width:55%; text-align:right; font-size:.85rem; color:var(--muted);
                    overflow-wrap:anywhere; }
  .uploads .state.ok { color:var(--ok); } .uploads .state.err { color:var(--err); }
  .uploads .dots { margin-right:6px; vertical-align:middle; }
  .uploads .dots i { width:5px; height:5px; }
  #dropOverlay { position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
                 padding:24px; background:color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter:blur(3px);
                 pointer-events:none; animation:fade .12s; }
  #dropOverlay div { display:flex; flex-direction:column; align-items:center; gap:6px; padding:36px 48px;
                     border:2px dashed var(--accent); border-radius:22px; background:var(--surface);
                     box-shadow:var(--shadow); text-align:center; }
  #dropOverlay svg { width:40px; height:40px; color:var(--accent); }
  #dropOverlay b { font-size:1.1rem; }

  @media (max-width: 600px) {
    .prow { grid-template-columns:1fr; }
    /* lists in the panels: the name gets its own line instead of a thin column */
    .card .row { flex-wrap:wrap; }
    .card .row .grow { flex-basis:100%; }
    .card .row > .muted { flex:1; }
    .uploads .state { max-width:none; text-align:left; }
    .phead-row { display:none; }
    .hint { display:none; }
    .hero h2 { font-size:1.35rem; }
  }
  @media (max-width: 800px) {
    #side { position:fixed; z-index:30; top:0; bottom:0; left:-300px; transition:left .2s; box-shadow:var(--shadow); }
    #app.collapsed #side { display:flex; }
    #side.open { left:0; }
    #side.open ~ #scrim { display:block; position:fixed; inset:0; background:rgba(8,12,18,.45); z-index:25; }
    #backend { max-width:140px; }
    #chat { padding:16px 12px 8px; }
    .composer-wrap { padding:6px 10px 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <img class="logo" src="/static/logo-mark.png" alt="">
      <div><b>RouSanGPT</b><small>Networks &amp; Crypto tutor</small></div>
      <button class="ico" id="hideSide" title="Hide the sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <button id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search chats" autocomplete="off">
    </div>
    <div class="list-label">Chats</div>
    <div id="list"></div>
    <div class="bottom">
      <button id="openMaterials" title="Course materials">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5Z"/><path d="M8 7h7"/></svg>
        Materials
      </button>
      <button id="openTools" title="Formula tools">

        Tools
      </button>
      <button id="openSettingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        Settings
      </button>

  </aside>
  <div id="scrim"></div>
  <main>
    <header>
      <button class="ico" id="toggleSide" title="Show or hide the sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>

          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>

    <div id="chat"></div>
    <div class="composer-wrap">

        <textarea id="input" rows="1" placeholder="Ask about networks, or ask for a quiz, diagram or video..."></textarea>
        <div class="bar-row">
          <select id="lang" title="Language for voice and answers">
            <option value="auto">Auto language</option>
            <option value="english">English</option>
            <option value="arabic">العربية</option>
          </select>
          <span class="spacer"></span>
          <button id="mic" title="Speak your question"></button>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>

<div id="modal" class="hidden">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="phead"><h2 id="mtitle"></h2>
      <button id="mclose" class="ico" title="Close (Esc)">

      </button>

    <div id="mbody"></div>

</div>

<div id="dropOverlay" class="hidden">
  <div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <b>Drop to add to the course materials</b>
    <span class="muted">PDF, PPTX, PPT or TXT files, or a folder of them</span>
  </div>
</div>

<script>
const appEl = document.getElementById("app");
const chatEl = document.getElementById("chat");
const listEl = document.getElementById("list");
const sideEl = document.getElementById("side");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");
const langEl = document.getElementById("lang");
const backendEl = document.getElementById("backend");
const modalEl = document.getElementById("modal");
const mtitle = document.getElementById("mtitle");
const mbody = document.getElementById("mbody");
const searchEl = document.getElementById("search");
const chatTitleEl = document.getElementById("chatTitle");

const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>'
};
let allChats = [];
let pendingTitle = null;      // title shown for a new chat until its first answer is saved
let busy = false, currentChat = null, messageCount = 0;
let currentAudio = null, currentBtn = null;

// show page errors in the blue line above the input box
window.addEventListener("error", function (e) {
  statusEl.textContent = "Page error: " + e.message + " (line " + e.lineno + ")";
});
window.addEventListener("unhandledrejection", function (e) {
  statusEl.textContent = "Page error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
});

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function piecesText(n) { return n + (n === 1 ? " piece" : " pieces"); }

// A picture or video that was deleted from the data folder: a short note, not a broken box
function mediaGone(node, what) {
  const note = el("p", "muted", "(This " + what + " is no longer available.)");
  note.dir = "ltr";                        // also inside an Arabic answer
  node.replaceWith(note);
}

function sleep(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }

// A small Markdown reader: code blocks, headings, bold, italics, lists, links
function md(src) {
  const FENCE = String.fromCharCode(96).repeat(3);
  const blocks = [];
  const fence = new RegExp(FENCE + "[a-zA-Z]*\\n?([\\s\\S]*?)" + FENCE, "g");
  src = src.replace(fence, function (_, code) { blocks.push(code); return "\u0000" + (blocks.length - 1) + "\u0000"; });
  src = esc(src);
  const inline = function (s) {
    return s.replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
            .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
            .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  };
  let html = "", list = null;
  const closeList = function () { if (list) { html += "</" + list + ">"; list = null; } };
  src.split("\n").forEach(function (line) {
    let m;
    if ((m = line.match(/^\s*\u0000(\d+)\u0000\s*$/))) {
      closeList(); html += "<pre><code>" + esc(blocks[+m[1]]) + "</code></pre>";
    } else if ((m = line.match(/^#{1,6}\s+(.*)$/))) {
      closeList(); html += "<h4>" + inline(m[1]) + "</h4>";
    } else if ((m = line.match(/^\s*[-*\u2022]\s+(.*)$/))) {
      if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
      html += "<li>" + inline(m[1]) + "</li>";
    } else if (line.trim() === "") {
      closeList();
    } else {
      closeList(); html += "<p>" + inline(line) + "</p>";
    }
  });
  closeList();
  return html;
}

// Keep the newest message in view. "atBottom" remembers whether the reader is at the
// end of the chat, so pictures and videos that finish loading later keep it there
// (but never pull the reader down while they are reading something higher up).
let atBottom = true, bulk = false;
chatEl.addEventListener("scroll", function () {
  atBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80;
}, { passive: true });
function scrollDown(instant) {
  if (bulk) return;                            // a whole chat is being shown: scroll once at the end
  if (instant) chatEl.style.scrollBehavior = "auto";
  chatEl.scrollTop = chatEl.scrollHeight;
  if (instant) chatEl.style.scrollBehavior = "";
  atBottom = true;
}
function keepAtBottom() { if (atBottom) scrollDown(true); }

function setStatus(text, ms) {
  statusEl.textContent = text || "";
  if (ms) setTimeout(function () { if (statusEl.textContent === text) statusEl.textContent = ""; }, ms);
}

async function api(method, url, body) {
  const opts = { method: method, headers: {} };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) {
    let msg = "Error " + r.status;
    if (data && data.detail) msg = (typeof data.detail === "string") ? data.detail : JSON.stringify(data.detail);
    throw new Error(msg);
  }
  return data;
}

// ---- Messages ----
function removeHero() {
  const h = chatEl.querySelector(".hero");
  if (h) h.remove();
}

function addUser(text) {
  removeHero();
  const turn = el("div", "turn user");
  const d = el("div", "msg", text);
  d.dir = "auto";
  turn.appendChild(d);
  chatEl.appendChild(turn); scrollDown();
}

function botTurn() {
  const turn = el("div", "turn bot");
  const av = el("img", "avatar"); av.src = "/static/logo-mark.png"; av.alt = "";
  turn.appendChild(av);
  const d = el("div", "msg");
  turn.appendChild(d);
  chatEl.appendChild(turn);
  return d;
}

function setListen(btn, state) {
  const label = { idle: "Listen", loading: "Loading...", playing: "Stop" }[state];
  btn.innerHTML = (state === "playing" ? ICON.stop : ICON.speaker) + "<span>" + label + "</span>";
}

function addBot(reply, canSpeak) {
  const d = botTurn();
  d.dir = "auto";
  d.innerHTML = md(reply.text || "");

  (reply.media || []).forEach(function (m) {
    if (m.type === "video") {
      const v = document.createElement("video");
      v.controls = true; v.src = m.url; v.preload = "metadata";
      v.addEventListener("loadedmetadata", keepAtBottom);
      v.addEventListener("error", function () { mediaGone(v, "video"); });
      d.appendChild(v);
    } else {
      const a = document.createElement("a");
      a.href = m.url; a.target = "_blank";
      const img = document.createElement("img"); img.src = m.url; img.alt = "";
      img.decoding = "async";
      img.addEventListener("load", keepAtBottom);
      img.addEventListener("error", function () { mediaGone(a, "picture"); });
      a.appendChild(img); d.appendChild(a);
    }
  });
  const info = [];
  if (reply.model) info.push("Answered by: " + reply.model);
  if (reply.tools && reply.tools.length) info.push("Tools used: " + reply.tools.join(", "));
  if (info.length) {
    const meta = el("div", "meta tools");
    info.forEach(function (t) { meta.appendChild(el("span", "pill", t)); });
    d.appendChild(meta);
  }
  if (reply.sources && reply.sources.length) {
    const det = document.createElement("details");
    det.appendChild(el("summary", null, "Sources (" + reply.sources.length + ")"));
    const ul = document.createElement("ul");
    reply.sources.forEach(function (s) { ul.appendChild(el("li", null, s.source + " - " + s.location)); });
    det.appendChild(ul); d.appendChild(det);
  }
  if (canSpeak && reply.text) {
    const actions = el("div", "actions");
    const sp = el("button");
    sp.dataset.playing = "0"; setListen(sp, "idle");
    sp.onclick = function () { toggleSpeak(sp, reply.text); };
    const cp = el("button");
    cp.innerHTML = ICON.copy + "<span>Copy</span>";
    cp.onclick = async function () {
      try {
        await navigator.clipboard.writeText(reply.text);
        cp.innerHTML = ICON.check + "<span>Copied</span>";
        setTimeout(function () { cp.innerHTML = ICON.copy + "<span>Copy</span>"; }, 1500);
      } catch (e) { setStatus("Could not copy: " + e.message, 4000); }
    };
    actions.appendChild(sp); actions.appendChild(cp);
    d.appendChild(actions);
  }
  (reply.chips || []).forEach(function (text) {
    const b = el("button", "chip", text);
    b.onclick = function () { send(text); };
    d.appendChild(b);
  });
  scrollDown();
}

function addWaiting() {
  const d = botTurn();
  d.className = "msg waiting";
  d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  const label = el("span", null, "Thinking...");
  d.appendChild(label);
  scrollDown();
  const t0 = Date.now();
  let note = "";                       // for example "Gemini is busy, retrying..."
  const timer = setInterval(function () {
    const s = Math.round((Date.now() - t0) / 1000);
    label.textContent = note ? note + " " + s + "s"
      : "Thinking... " + s + "s" + (s > 20 ? " (videos and animations can take a few minutes)" : "");
  }, 1000);
  return { stop: function () { clearInterval(timer); d.parentNode.remove(); },
           note: function (text) { note = text || ""; } };
}

const SUGGESTIONS = [
  ["Explain a concept", "What is the difference between TCP and UDP?"],
  ["Practice", "Quiz me on subnetting"],
  ["Draw a diagram", "Draw the TCP three-way handshake"],
  ["Watch it move", "Show me an animation of Dijkstra's algorithm"],
  ["Make a video", "Make a video explaining how DNS works"],
  ["Calculate", "What is the transmission delay of a 1500 byte packet on a 10 Mbps link?"]
];

function welcome() {
  const hero = el("div", "hero");
  const logo = el("img", "hero-logo"); logo.src = "/static/logo.png"; logo.alt = "RouSanGPT";
  hero.appendChild(logo);
  hero.appendChild(el("h2", null, "How can I help you study?"));
  hero.appendChild(el("p", null, "I answer from your course slides and books, calculate exactly, draw diagrams, " +
    "run quizzes and make videos. Type or use the microphone, in English or Arabic."));
  const grid = el("div", "suggest");
  SUGGESTIONS.forEach(function (sg) {
    const b = el("button");
    b.appendChild(el("b", null, sg[0]));
    b.appendChild(el("span", null, sg[1]));
    b.onclick = function () { send(sg[1]); };
    grid.appendChild(b);
  });
  hero.appendChild(grid);
  chatEl.appendChild(hero);
}

function setBusy(b) {
  busy = b; sendBtn.disabled = b; input.disabled = b; micBtn.disabled = b;
  // gray out the other chats: you cannot switch chats while an answer is coming
  listEl.classList.toggle("locked", b);
  listEl.title = b ? "Wait for the answer to finish before opening another chat" : "";
  document.getElementById("newChat").disabled = b;
  if (!b) input.focus();
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

// ---- Sidebar: show or hide ----
function isNarrow() { return window.matchMedia("(max-width: 800px)").matches; }

function toggleSide() {
  if (isNarrow()) { sideEl.classList.toggle("open"); return; }
  appEl.classList.toggle("collapsed");
  localStorage.setItem("sideCollapsed", appEl.classList.contains("collapsed") ? "1" : "0");
}

// ---- Saved chats ----
function iconBtn(label, title, handler) {
  const b = el("button", "icon act", label);
  b.title = title; b.onclick = handler;
  return b;
}

async function refreshList() {
  const chats = await api("GET", "/api/chats");
  allChats = chats;
  renderList();
  return chats;
}

function renderList() {
  const q = searchEl.value.trim().toLowerCase();
  const current = allChats.find(function (c) { return c.id === currentChat; });
  chatTitleEl.textContent = current ? current.title : "New chat";
  chatTitleEl.dir = "auto";
  listEl.innerHTML = "";
  let shown = allChats.filter(function (c) { return !q || (c.title || "").toLowerCase().indexOf(q) !== -1; });
  if (pendingTitle && currentChat && !current) {
    shown = [{ id: currentChat, title: pendingTitle, pending: true }].concat(shown);
    chatTitleEl.textContent = pendingTitle;
  }
  if (!shown.length) listEl.appendChild(el("div", "empty-list", q ? "No chats match." : "No chats yet."));
  shown.forEach(function (c) {
    const row = el("div", "item" + (c.id === currentChat ? " active" : ""));
    const t = el("span", "t", c.title);
    t.dir = "auto";
    row.appendChild(t);
    row.appendChild(iconBtn("\u270E", "Rename", function (e) { e.stopPropagation(); renameChat(c); }));
    row.appendChild(iconBtn("\u2715", "Delete", function (e) { e.stopPropagation(); deleteChat(c); }));
    row.onclick = function () { openChat(c.id); };
    listEl.appendChild(row);
  });
}

async function openChat(id) {
  if (busy) return;
  stopAudio();
  const data = await api("GET", "/api/chats/" + id);
  currentChat = id; pendingTitle = null; localStorage.setItem("lastChat", id);
  chatEl.innerHTML = ""; messageCount = data.messages.length;
  if (!messageCount) welcome();
  bulk = true;
  try {
    data.messages.forEach(function (m) {
      if (m.role === "user") addUser(m.text); else addBot(m, true);
    });
  } finally { bulk = false; }
  sideEl.classList.remove("open");
  renderList();                                // the list itself did not change
  scrollDown(true);
}

// "+ New chat" shows a blank chat. It is saved (and appears in the sidebar) when you send the first message.
async function newChat() {
  if (busy) return;
  stopAudio();
  currentChat = null; pendingTitle = null; messageCount = 0;
  localStorage.removeItem("lastChat");
  chatEl.innerHTML = ""; welcome();
  sideEl.classList.remove("open");
  await refreshList();
  input.focus();
}

async function renameChat(c) {
  const name = prompt("Rename this chat:", c.title);
  if (name === null) return;
  await api("PATCH", "/api/chats/" + c.id, { title: name });
  await refreshList();
}

async function deleteChat(c) {
  if (busy || !confirm('Delete "' + c.title + '"?')) return;
  await api("DELETE", "/api/chats/" + c.id);
  if (c.id === currentChat) {
    currentChat = null; localStorage.removeItem("lastChat");
    const chats = await refreshList();
    if (chats.length) await openChat(chats[0].id); else await newChat();
  } else {
    await refreshList();
  }
}

// ---- Sending a question ----
async function send(text) {
  text = (text === undefined ? input.value : text).trim();
  if (!text || busy) return;
  input.value = ""; autosize();
  addUser(text); setBusy(true);
  const waiting = addWaiting();
  try {
    if (!currentChat) {                      // first message of a new chat: create it now
      const created = await api("POST", "/api/chats");
      currentChat = created.id;
      localStorage.setItem("lastChat", created.id);
      pendingTitle = text;                   // show it in the sidebar while the first answer comes
      renderList();
    }
    const j = await api("POST", "/api/chat", {
      chat_id: currentChat, message: text, language: langEl.value, backend: backendEl.value
    });
    // the answer is prepared in the background: the server holds each request until
    // the answer is ready (at most 15 s), so it shows the moment it is done
    let result = null, failures = 0;
    while (!result) {
      try {
        const data = await api("GET", "/api/result/" + j.job_id + "?wait=15");
        if (data.status === "error") throw new Error(data.error);
        if (data.status === "done") result = data;
        else waiting.note(data.message);
        failures = 0;
      } catch (e) {
        if (e.message.indexOf("tutor") !== -1 || ++failures > 5) throw e;
        await sleep(1500);
      }
    }
    waiting.stop();
    messageCount += 2;
    addBot({ text: result.reply, tools: result.tools, sources: result.sources,
             media: result.media, model: result.model }, true);
    refreshList();
  } catch (e) {
    waiting.stop();
    addBot({ text: "Something went wrong: " + e.message }, false);
  }
  setBusy(false);
}

// ---- Read an answer aloud ----
function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentBtn) { currentBtn.dataset.playing = "0"; setListen(currentBtn, "idle"); currentBtn = null; }
}

async function toggleSpeak(btn, text) {
  if (btn.dataset.playing === "1") { stopAudio(); return; }
  stopAudio();
  setListen(btn, "loading");
  try {
    const r = await fetch("/api/speak", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });
    if (!r.ok) {
      let d = null; try { d = await r.json(); } catch (e) {}
      throw new Error((d && d.detail) || ("Error " + r.status));
    }
    const audio = new Audio(URL.createObjectURL(await r.blob()));
    currentAudio = audio; currentBtn = btn;
    btn.dataset.playing = "1"; setListen(btn, "playing");
    audio.onended = stopAudio;
    await audio.play();
  } catch (e) {
    setListen(btn, "idle");
    setStatus("Could not read aloud: " + e.message, 6000);
  }
}

// ---- Voice input ----
let recorder = null, chunks = [];

async function toggleMic() {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = []; recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async function () {
      stream.getTracks().forEach(function (t) { t.stop(); });

    setStatus("Listening... press Stop when you finish speaking.");
  } catch (e) {
    const noApi = !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;
    setStatus(noApi ? "Voice input is not available in this window. It needs a Chromium-based browser " +
                      "(Chromium, Chrome, Brave or Edge) or Firefox."
                    : "Microphone not available: " + e.message, 8000);
  }
}

async function uploadVoice(blob) {

// One line under the chat while the panel is closed: "Adding course files: 2 of 5 done"
function uploadSummary() {
  if (materialsView) return;
  const finished = uploads.filter(function (u) { return u.state === "done" || u.state === "failed"; }).length;
  if (uploadsActive()) { setStatus("Adding course files: " + finished + " of " + uploads.length + " done..."); return; }
  const failed = uploads.filter(function (u) { return u.state === "failed"; }).length;
  setStatus(failed ? "Course files added, but " + failed + " could not be added. Open Materials to see why."
                   : "Course files added (" + finished + "). The tutor can use them now.", 8000);
}

function setUpload(u, state, text) {
  u.state = state; u.text = text;
  renderUploads(); uploadSummary();
}

function addUploads(files) {
  if (!uploadsActive()) uploads.length = 0;
  files.forEach(function (f) {
    if (isMaterial(f.name)) uploads.push({ file: f, name: f.name, state: "waiting", text: "waiting" });
    else uploads.push({ name: f.name, state: "failed", text: "skipped: only PDF, PPTX, PPT or TXT" });
  });
  if (!materialsView) openMaterials();
  renderUploads();
  runUploads();
}

// Files are sent one after the other; the server adds them to the knowledge in the
// same order, while the next ones are already being sent.
async function runUploads() {
  if (uploading) return;
  uploading = true;
  const watching = [];
  let u;
  while ((u = uploads.find(function (x) { return x.state === "waiting"; }))) {
    setUpload(u, "uploading", "sending...");
    try {
      const fd = new FormData(); fd.append("file", u.file, u.name);
      const r = await fetch("/api/materials", { method: "POST", body: fd });
      let j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok) throw new Error((j && j.detail) || ("Error " + r.status));
      setUpload(u, "adding", "reading");
      watching.push(watchUpload(u, j.job_id));
    } catch (e) {
      setUpload(u, "failed", "failed: " + e.message);
    }
  }
  uploading = false;
  await Promise.all(watching);
  if (!uploadsActive()) { renderMaterialList(); checkStatus(); }
}

async function watchUpload(u, jobId) {
  let failures = 0;
  while (true) {
    let s;
    try { s = await api("GET", "/api/result/" + jobId + "?wait=2"); failures = 0; }
    catch (e) {
      if (++failures > 5) { setUpload(u, "failed", "failed: " + e.message); return; }
      await sleep(1000); continue;
    }
    if (s.status === "working") {
      if (u.text !== (s.message || "adding")) setUpload(u, "adding", s.message || "adding");
      continue;
    }
    if (s.status === "error") { setUpload(u, "failed", s.error.replace("Could not add " + u.name + ": ", "failed: ")); return; }
    setUpload(u, "done", piecesText(s.pieces) + " - " + (GROUP_NAMES[s.group] || s.group));
    return;
  }
}

// Files dropped on the window (folders too: their files are added)
async function filesFromDrop(dt) {
  const plain = Array.from(dt.files || []);
  // the entries must be read now: the browser empties the drop data after this event
  const entries = Array.from(dt.items || []).map(function (i) {
    return i.kind === "file" && i.webkitGetAsEntry ? i.webkitGetAsEntry() : null;
  }).filter(Boolean);
  if (!entries.some(function (e) { return e.isDirectory; })) return plain;
  const out = [];
  async function walk(entry, depth) {
    if (entry.isFile) {
      try { out.push(await new Promise(function (ok, bad) { entry.file(ok, bad); })); } catch (e) {}
    } else if (entry.isDirectory && depth < 6) {
      const reader = entry.createReader();
      while (true) {
        const batch = await new Promise(function (ok, bad) { reader.readEntries(ok, bad); }).catch(function () { return []; });
        if (!batch.length) break;
        for (const child of batch) await walk(child, depth + 1);
      }
    }
  }
  for (const e of entries) await walk(e, 0);
  return out;
}

const dropOverlay = document.getElementById("dropOverlay");
let dragDepth = 0;
function draggingFiles(e) {
  return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") !== -1;
}
function canDropHere() { return !document.querySelector(".setup"); }
function dragEnded() {
  dragDepth = 0;
  dropOverlay.classList.add("hidden");
  if (materialsView) materialsView.drop.classList.remove("over");
}
window.addEventListener("dragenter", function (e) {
  if (!draggingFiles(e) || !canDropHere()) return;
  e.preventDefault();
  dragDepth++;
  // the open Materials panel has its own drop zone: light it up instead
  if (materialsView) materialsView.drop.classList.add("over");
  else dropOverlay.classList.remove("hidden");
});
window.addEventListener("dragover", function (e) {
  if (!draggingFiles(e)) return;
  e.preventDefault();                               // allow dropping (and never open the file in the window)
  e.dataTransfer.dropEffect = canDropHere() ? "copy" : "none";
});
window.addEventListener("dragleave", function (e) {
  if (!draggingFiles(e)) return;
  if (--dragDepth <= 0) dragEnded();
});
window.addEventListener("drop", async function (e) {
  if (!draggingFiles(e)) return;
  e.preventDefault();
  dragEnded();
  if (!canDropHere()) return;
  const files = await filesFromDrop(e.dataTransfer);
  if (files.length) addUploads(files);
});

// ---- Tools panel: formula tools anyone can create ----
const FORMULA_FUNCTIONS = ["sqrt", "log2", "log10", "ln", "exp", "ceil", "floor", "abs",
                           "round", "min", "max", "pi", "e"];

const TOOL_EXAMPLES = [
  { label: "Queuing delay", name: "queuing_delay",
    description: "Queuing delay of a packet that waits behind N other packets. Use it when a question asks how long a packet waits in a router queue.",
    formula: "N * L / R", unit: "seconds",
    inputs: { N: ["packets ahead in the queue", 3], L: ["packet length in bits", 12000],
              R: ["link rate in bits per second", 1000000] } },
  { label: "Propagation delay", name: "propagation_delay",
    description: "Propagation delay of a signal over a link. Use it when a question gives the link length and the signal speed.",
    formula: "d / s", unit: "seconds",
    inputs: { d: ["link length in meters", 2000000], s: ["propagation speed in meters per second", 200000000] } },
  { label: "Stop-and-wait utilization", name: "stop_and_wait_utilization",
    description: "Sender utilization of the stop-and-wait protocol (fraction of time the sender is busy sending).",
    formula: "(L / R) / (RTT + L / R)", unit: "",
    inputs: { L: ["packet length in bits", 8000], R: ["link rate in bits per second", 1000000000],
              RTT: ["round trip time in seconds", 0.03] } },
  { label: "Window throughput", name: "window_throughput",
    description: "Throughput of a sliding window (or TCP) sender that sends W bits per round trip time.",
    formula: "W / RTT", unit: "bits per second",
    inputs: { W: ["window size in bits", 64000], RTT: ["round trip time in seconds", 0.1] } },
];

function field(parent, label, kind) {
  const wrap = el("label", "field");
  wrap.appendChild(el("span", null, label));
  const box = document.createElement(kind);
  if (kind === "textarea") box.rows = 2;
  wrap.appendChild(box);
  parent.appendChild(wrap);
  return box;
}

// The input names used in a formula, in order of first appearance.
// The look-behind makes sure "1e6" is a number and not an input called "e6".
function formulaNames(formula) {
  const found = [];
  (formula.match(/(?<![0-9.])[A-Za-z_][A-Za-z0-9_]*/g) || []).forEach(function (n) {
    if (FORMULA_FUNCTIONS.indexOf(n) === -1 && found.indexOf(n) === -1) found.push(n);
  });
  return found;
}

function fmtNumber(x) {
  if (typeof x !== "number") return String(x);
  if (x !== 0 && (Math.abs(x) < 1e-4 || Math.abs(x) >= 1e9)) return x.toExponential(4);
  return String(Math.round(x * 1e8) / 1e8);
}

async function openTools(note) {
  showModal("Tools");
  let data;
  try { data = await api("GET", "/api/tools"); }
  catch (e) { mbody.appendChild(el("p", "muted", "Could not load the tools: " + e.message)); return; }

  // ---- a) Your tools ----
  const custom = el("div", "card");
  custom.appendChild(el("b", null, "Your tools (" + data.custom.length + ")"));
  if (note) custom.appendChild(el("p", "ok", note));
  if (!data.custom.length) custom.appendChild(el("p", "muted", "None yet. Create one below."));
  data.custom.forEach(function (t) {
    const row = el("div", "row");
    const info = el("span", "grow");
    info.appendChild(el("b", null, t.name));
    info.appendChild(document.createTextNode(" = " + t.formula + (t.unit ? "  [" + t.unit + "]" : "")));
    info.appendChild(el("div", "muted", t.description));
    row.appendChild(info);
    const edit = el("button", "small", "Edit");
    edit.onclick = function () { startEdit(t); };
    const del = el("button", "small danger", "Delete");
    del.onclick = async function () {
      if (!confirm("Delete the tool " + t.name + "?")) return;
      try { await api("DELETE", "/api/tools/" + encodeURIComponent(t.name)); openTools("Deleted " + t.name + "."); }
      catch (e) { setStatus("Could not delete: " + e.message, 6000); }
    };
    row.appendChild(edit); row.appendChild(del);
    custom.appendChild(row);
  });
  mbody.appendChild(custom);

  // ---- b) Create a tool ----
  const form = el("div", "card");
  const formTitle = el("b", null, "Create a tool");
  form.appendChild(formTitle);

  const ideaBox = field(form, "Describe the calculation (English or Arabic), and the AI fills the form for you", "textarea");
  ideaBox.placeholder = "For example: the time to send a packet of L bits on a link of R bits per second";
  const aiBtn = el("button", "small", "Fill the form with AI");
  const aiMsg = el("span", "muted", "");
  aiMsg.style.marginLeft = "10px";
  form.appendChild(aiBtn); form.appendChild(aiMsg);

  const chips = el("div", "chips");
  chips.appendChild(el("span", "muted", "Or start from an example: "));
  TOOL_EXAMPLES.forEach(function (ex) {
    const c = el("button", "small chip", ex.label);
    c.onclick = function () {
      const inputs = {};
      Object.keys(ex.inputs).forEach(function (k) {
        inputs[k] = { description: ex.inputs[k][0], example: ex.inputs[k][1] };
      });
      fillForm({ name: ex.name, description: ex.description, formula: ex.formula, unit: ex.unit }, inputs);
      aiMsg.textContent = "";
    };
    chips.appendChild(c);
  });
  form.appendChild(chips);

  // ---- c) The form ----
  const fName = field(form, "Tool name (English letters, digits and _, for example queuing_delay)", "input");
  const fDesc = field(form, "What it calculates and when the tutor should use it", "textarea");
  const fFormula = field(form, "Formula, for example   N * L / R", "input");
  const fUnit = field(form, "Unit of the result (optional), for example seconds", "input");
  fFormula.spellcheck = false;

  form.appendChild(el("span", "muted", "Inputs (found automatically in the formula):"));
  const rowsBox = el("div", null);
  form.appendChild(rowsBox);
  const testMsg = el("p", "muted", "");
  form.appendChild(testMsg);

  const saveBtn = el("button", "small", "Save tool");
  const cancelBtn = el("button", "small", "Cancel editing");
  cancelBtn.style.marginLeft = "8px";
  cancelBtn.hidden = true;
  const msg = el("p", "muted", "");
  form.appendChild(saveBtn); form.appendChild(cancelBtn); form.appendChild(msg);
  mbody.appendChild(form);

  // what the user typed for each input, kept even while the formula changes
  let state = {};
  let editing = null;
  let testTimer = null;

  function inputValues() {
    const values = {}, missing = [];
    formulaNames(fFormula.value).forEach(function (n) {
      const s = state[n] || {};
      const v = s.example === undefined || s.example === null || s.example === "" ? NaN : parseFloat(s.example);
      if (isNaN(v)) missing.push(n); else values[n] = v;
    });
    return { values: values, missing: missing };
  }

  function renderRows() {
    const names = formulaNames(fFormula.value);
    rowsBox.innerHTML = "";
    if (!names.length) {
      rowsBox.appendChild(el("p", "muted", "Type a formula above and its inputs appear here."));
      return;
    }
    const head = el("div", "prow phead-row");
    head.appendChild(el("span", "muted", "Input"));
    head.appendChild(el("span", "muted", "Meaning (with unit)"));
    head.appendChild(el("span", "muted", "Example value"));
    rowsBox.appendChild(head);
    names.forEach(function (n) {
      const s = state[n] || (state[n] = { description: "", example: "" });
      const row = el("div", "prow");
      row.appendChild(el("b", null, n));
      const meaning = document.createElement("input");
      meaning.placeholder = "for example: packet length in bits";
      meaning.value = s.description || "";
      meaning.oninput = function () { s.description = meaning.value; };
      const example = document.createElement("input");
      example.type = "text"; example.inputMode = "decimal";
      example.placeholder = "for example 1500";
      example.value = s.example === null || s.example === undefined ? "" : String(s.example);
      example.oninput = function () { s.example = example.value.trim(); scheduleTest(); };
      row.appendChild(meaning); row.appendChild(example);
      rowsBox.appendChild(row);
    });
  }

  // ---- d) Live test ----
  function scheduleTest() {
    clearTimeout(testTimer);
    testTimer = setTimeout(runTest, 400);
  }

  async function runTest() {
    const formula = fFormula.value.trim();
    if (!formula) { testMsg.textContent = ""; return; }
    const iv = inputValues();
    if (iv.missing.length) {
      testMsg.className = "muted";
      testMsg.textContent = "Give an example value for: " + iv.missing.join(", ") + " to test the formula.";
      return;
    }
    try {
      const r = await api("POST", "/api/tools/test", { formula: formula, values: iv.values });
      testMsg.className = "ok";
      testMsg.textContent = "Test result with the example values: " + fmtNumber(r.result) +
        (fUnit.value.trim() ? " " + fUnit.value.trim() : "");
    } catch (e) {
      testMsg.className = "err";
      testMsg.textContent = e.message;
    }
  }

  fFormula.addEventListener("input", function () { renderRows(); scheduleTest(); });
  fUnit.addEventListener("input", scheduleTest);

  function fillForm(spec, inputs) {
    fName.value = spec.name || "";
    fDesc.value = spec.description || "";
    fFormula.value = spec.formula || "";
    fUnit.value = spec.unit || "";
    state = {};
    Object.keys(inputs || {}).forEach(function (k) {
      const i = inputs[k];
      state[k] = { description: i.description || "",
                   example: i.example === null || i.example === undefined ? "" : String(i.example) };
    });
    msg.textContent = "";
    renderRows();
    runTest();
  }

  function inputsFromParams(params) {
    const inputs = {};
    (params || []).forEach(function (p) { inputs[p.name] = { description: p.description, example: p.example }; });
    return inputs;
  }

  // ---- e) Edit mode ----
  function setEditing(name) {
    editing = name;
    fName.disabled = !!name;
    formTitle.textContent = name ? "Editing " + name : "Create a tool";
    saveBtn.textContent = name ? "Save changes" : "Save tool";
    cancelBtn.hidden = !name;
  }

  function startEdit(t) {
    setEditing(t.name);
    fillForm(t, inputsFromParams(t.params));
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  cancelBtn.onclick = function () {
    setEditing(null);
    fillForm({}, {});
  };

  aiBtn.onclick = async function () {
    const idea = ideaBox.value.trim();
    if (idea.length < 5) { aiMsg.textContent = "Describe the calculation in a few words first."; return; }
    aiBtn.disabled = true;
    aiMsg.className = "muted";
    aiMsg.textContent = "Asking the AI...";
    try {
      const d = await api("POST", "/api/tools/draft", { idea: idea });
      if (editing) d.name = editing;           // keep the name when editing
      fillForm(d, inputsFromParams(d.params));
      if (d.warning) { aiMsg.className = "err"; aiMsg.textContent = d.warning; }
      else { aiMsg.className = "ok"; aiMsg.textContent = "Draft ready. Check it, change anything you like, then save."; }
    } catch (e) {
      aiMsg.className = "err";
      aiMsg.textContent = e.message;
    } finally {
      aiBtn.disabled = false;
    }
  };

  // ---- f) Save ----
  saveBtn.onclick = async function () {
    const params = formulaNames(fFormula.value).map(function (n) {
      const s = state[n] || {};
      const v = s.example === "" || s.example === undefined || s.example === null ? null : parseFloat(s.example);
      return { name: n, description: (s.description || "").trim(), example: isNaN(v) ? null : v };
    });
    saveBtn.disabled = true;
    try {
      const spec = await api("POST", "/api/tools", {
        name: (editing || fName.value).trim(), description: fDesc.value, params: params,
        formula: fFormula.value, unit: fUnit.value, replace: !!editing
      });
      openTools((editing ? "Updated " : "Saved ") + spec.name + ". The tutor can use it from your next message.");
    } catch (e) {
      msg.className = "err";
      msg.textContent = e.message;
      saveBtn.disabled = false;
    }
  };

  renderRows();

  // ---- g) Built-in tools, for reference ----
  const builtIn = el("details", "card");
  builtIn.appendChild(el("summary", null, "Built-in tools (" + data.builtin.length + ")"));
  data.builtin.forEach(function (t) {
    const row = el("div", "row");
    const s = el("span", "grow");
    s.appendChild(el("b", null, t.name));
    s.appendChild(el("div", "muted", t.about));
    row.appendChild(s);
    builtIn.appendChild(row);
  });
  mbody.appendChild(builtIn);
}

let firstStatus = true;
async function checkStatus() {
  try {
    const s = await api("GET", "/api/status");
    appMode = s.app_mode;
    if (firstStatus) {                       // defaults from Settings, unless chosen here before
      firstStatus = false;
      let saved = {};
      try { saved = { lang: localStorage.getItem("lang"), backend: localStorage.getItem("backend") }; } catch (e) {}
      if (!saved.lang) langEl.value = s.default_language || "auto";
      if (!saved.backend) backendEl.value = s.default_backend || "auto";
    }
    const local = backendEl.querySelector('option[value="local"]');
    if (s.local_ready) {
      local.disabled = false;
      local.textContent = "Local model (" + s.local_model + ")";
    } else if (!s.local_running && s.local_installed) {
      local.disabled = false;                // choosing it (or chatting) starts Ollama
      local.textContent = "Local model (starts Ollama)";
    } else {
      local.disabled = true;
      local.textContent = "Local model (" + (s.local_running ? s.local_model + " not downloaded" : "Ollama not running") + ")";
      if (backendEl.value === "local") backendEl.value = "auto";
    }
    return s;
  } catch (e) { return null; }
}

// ---- Settings panel ----
let appMode = false;

function section(title, help) {
  const c = el("div", "card");
  c.appendChild(el("b", null, title));
  if (help) c.appendChild(el("p", "muted", help));
  mbody.appendChild(c);
  return c;
}

function selectBox(parent, label, options, value) {
  const wrap = el("label", "field");
  wrap.appendChild(el("span", null, label));
  const s = document.createElement("select");
  options.forEach(function (o) {
    const opt = el("option", null, o[1]); opt.value = o[0]; s.appendChild(opt);
  });
  s.value = value;
  wrap.appendChild(s); parent.appendChild(wrap);
  return s;
}

function keyForm(parent, onSaved) {
  const key = field(parent, "Gemini API key", "input");
  key.type = "password"; key.autocomplete = "off"; key.spellcheck = false;
  key.placeholder = "Paste your key (it starts with AIza...)";
  const row = el("div", "btnrow");
  const save = el("button", "small primary", "Test and save");
  const show = el("button", "small", "Show");
  show.onclick = function () { key.type = key.type === "password" ? "text" : "password"; show.textContent = key.type === "password" ? "Show" : "Hide"; };
  row.appendChild(save); row.appendChild(show);
  parent.appendChild(row);
  const msg = el("p", "muted", "");
  parent.appendChild(msg);
  async function go() {
    if (!key.value.trim()) { msg.className = "err"; msg.textContent = "Paste your key first."; return; }
    save.disabled = true; msg.className = "muted"; msg.textContent = "Testing the key with Google... (this can take up to a minute when Google is busy)";
    try {
      const r = await api("POST", "/api/settings/key", { key: key.value.trim() });
      msg.className = r.tested === false ? "muted" : "ok"; msg.textContent = r.message;
      key.value = "";
      if (onSaved) onSaved();
    } catch (e) { msg.className = "err"; msg.textContent = e.message; }
    save.disabled = false;
  }
  save.onclick = go;
  key.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  return key;
}

async function openSettings(note) {
  showModal("Settings");
  let s;
  try { s = await api("GET", "/api/settings"); }
  catch (e) { mbody.appendChild(el("p", "err", "Could not load the settings: " + e.message)); return; }
  if (note) mbody.appendChild(el("p", "ok", note));

  // API key
  const k = section("Gemini API key", s.has_key
    ? "A key is set (" + s.key_hint + (s.key_source === "env" ? ", from the .env file" : "") + "). Paste a new one to change it."
    : "No key yet. Get a free key at aistudio.google.com (Get API key), then paste it here.");
  const link = el("a", null, "Open aistudio.google.com/apikey");
  link.href = "https://aistudio.google.com/apikey"; link.target = "_blank"; link.rel = "noopener";
  k.appendChild(link);
  keyForm(k, function () { checkStatus(); });

  // Defaults
  const d = section("Defaults", "Used when you open the app. You can still change them at any time.");
  const lang = selectBox(d, "Answer and voice language", [["auto", "Auto (same as the question)"], ["english", "English"], ["arabic", "العربية (Arabic)"]], s.default_language);
  const back = selectBox(d, "Which AI answers", [["auto", "Auto (Gemini, local if offline)"], ["gemini", "Gemini (online)"], ["local", "Local model"]], s.default_backend);
  const dmsg = el("p", "muted", "");
  d.appendChild(dmsg);
  async function saveDefaults() {
    try {
      await api("POST", "/api/settings", { default_language: lang.value, default_backend: back.value });
      langEl.value = lang.value; store("lang", lang.value);
      if (!backendEl.querySelector('option[value="' + back.value + '"]').disabled) backendEl.value = back.value;
      store("backend", back.value);
      dmsg.className = "ok"; dmsg.textContent = "Saved.";
    } catch (e) { dmsg.className = "err"; dmsg.textContent = e.message; }
  }
  lang.onchange = saveDefaults; back.onchange = saveDefaults;

  // Local model
  const box = section("Local model (Ollama)", "Answers without the internet, on your own computer. Slower than Gemini and needs a few GB of disk space.");
  const localBody = el("div");
  box.appendChild(localBody);
  renderLocal(localBody);

  // App
  const a = section("About", "Your data (chats, course files, settings) is stored in: " + s.data_dir);
  if (s.app_mode) {
    const quit = el("button", "small danger", "Quit RouSanGPT");
    quit.onclick = async function () {
      quit.disabled = true;
      try { await api("POST", "/api/quit"); } catch (e) {}
      document.body.innerHTML = '<div class="bye"><img src="/static/logo-mark.png" alt=""><h2>RouSanGPT has stopped</h2><p>You can close this window.</p></div>';
      window.close();
    };
    a.appendChild(quit);
  }
}

async function renderLocal(box, note) {
  box.innerHTML = "";
  box.appendChild(el("p", "muted", "Checking Ollama..."));
  let st;
  try { st = await api("GET", "/api/local"); }
  catch (e) { box.innerHTML = ""; box.appendChild(el("p", "err", e.message)); return; }
  box.innerHTML = "";
  if (note) box.appendChild(el("p", "ok", note));

  const line = function (label, value, cls) {
    const r = el("div", "kv");
    r.appendChild(el("span", "muted", label));
    r.appendChild(el("span", cls || null, value));
    box.appendChild(r);
  };
  if (!st.installed && !st.running) {
    line("Status", "Ollama is not installed", "err");
    const p = el("p", "muted", "Install Ollama, then press Check again. ");
    const a = el("a", null, st.install_url); a.href = st.install_url; a.target = "_blank"; a.rel = "noopener";
    p.appendChild(a);
    p.appendChild(document.createTextNode(" (Arch Linux: sudo pacman -S ollama)"));
    box.appendChild(p);
  } else if (!st.running) {
    line("Status", "Installed, but not running", "err");
    const start = el("button", "small primary", "Start Ollama");
    start.onclick = async function () {
      start.disabled = true; start.textContent = "Starting...";
      try { const r = await api("POST", "/api/local/start"); renderLocal(box, r.message); }
      catch (e) { start.disabled = false; start.textContent = "Start Ollama"; box.appendChild(el("p", "err", e.message)); }
    };
    box.appendChild(start);
  } else {
    const who = { system: "the system service (ollama.service)", app: "started by RouSanGPT",
                  "windows-app": "the Ollama app", other: "an Ollama started outside RouSanGPT" }[st.runner] || "Ollama";
    line("Status", "Running, version " + st.version, "ok");
    line("In use", who);
    line("Models stored in", st.models_dir);
  }
  if (st.ram_gb) line("Your computer", st.ram_gb + " GB of memory, recommended model: " + st.recommended);

  if (st.running) {
    line("Downloaded", st.models.length ? st.models.map(function (m) { return m.name + " (" + m.size_gb + " GB)"; }).join(", ") : "nothing yet");

    // choose a model
    const names = st.models.map(function (m) { return m.name; });
    const choose = el("div", "card inner");
    choose.appendChild(el("b", null, "Model used for answers"));
    const pick = document.createElement("select");
    const all = names.slice();
    if (all.indexOf(st.current) === -1) all.unshift(st.current);
    all.forEach(function (n) {
      const o = el("option", null, n + (names.indexOf(n) === -1 ? " (not downloaded)" : "")); o.value = n; pick.appendChild(o);
    });
    pick.value = st.current;
    pick.onchange = async function () {
      try { await api("POST", "/api/settings", { local_model: pick.value }); checkStatus(); renderLocal(box, "Now using " + pick.value + "."); }
      catch (e) { box.appendChild(el("p", "err", e.message)); }
    };
    choose.appendChild(pick);
    if (!st.current_ready) choose.appendChild(el("p", "err", st.current + " is not downloaded yet. Download it below or choose another one."));
    box.appendChild(choose);

    // download a model
    const dl = el("div", "card inner");
    dl.appendChild(el("b", null, "Download a model"));
    const list = document.createElement("select");
    st.choices.forEach(function (c) {
      const o = el("option", null, c.name + "  (" + c.size_gb + " GB, " + c.about + ")" + (c.name === st.recommended ? "  - recommended" : ""));
      o.value = c.name; list.appendChild(o);
    });
    list.value = st.recommended;
    const go = el("button", "small primary", "Download");
    const bar = el("div", "progress hidden"); const fill = el("i"); bar.appendChild(fill);
    const msg = el("p", "muted", "");
    go.onclick = async function () {
      const model = list.value;
      go.disabled = true; bar.classList.remove("hidden"); fill.style.width = "0%";
      msg.className = "muted"; msg.textContent = "Starting the download of " + model + "...";
      try {
        const j = await api("POST", "/api/local/pull", { model: model });
        while (true) {
          const s = await api("GET", "/api/result/" + j.job_id + "?wait=1");
          if (s.status === "working") {
            msg.textContent = s.message || "working...";
            if (typeof s.percent === "number") fill.style.width = s.percent + "%";
            continue;
          }
          if (s.status === "error") throw new Error(s.error);
          break;
        }
        await api("POST", "/api/settings", { local_model: model });
        checkStatus();
        renderLocal(box, model + " is downloaded and is now the local model.");
      } catch (e) {
        msg.className = "err"; msg.textContent = e.message; go.disabled = false;
      }
    };
    const row = el("div", "btnrow"); row.appendChild(list); row.appendChild(go);
    dl.appendChild(row); dl.appendChild(bar); dl.appendChild(msg);
    box.appendChild(dl);
  }
  const again = el("button", "small", "Check again");
  again.onclick = function () { renderLocal(box); };
  box.appendChild(again);
}

// ---- First run: ask for the API key ----
function showSetup(status) {
  const ov = el("div", "setup");
  const card = el("div", "setup-card");
  const logo = el("img", "hero-logo"); logo.src = "/static/logo.png"; logo.alt = "RouSanGPT";
  card.appendChild(logo);
  card.appendChild(el("h2", null, "Welcome to RouSanGPT"));
  card.appendChild(el("p", "muted", "One step before you start: RouSanGPT uses Google's Gemini AI, which needs a free API key."));
  const steps = el("ol", "steps");
  const li1 = el("li"); li1.appendChild(document.createTextNode("Open "));
  const a = el("a", null, "aistudio.google.com/apikey"); a.href = "https://aistudio.google.com/apikey"; a.target = "_blank"; a.rel = "noopener";
  li1.appendChild(a); li1.appendChild(document.createTextNode(" and sign in with a Google account."));
  steps.appendChild(li1);
  steps.appendChild(el("li", null, "Press \"Create API key\" and copy it."));
  steps.appendChild(el("li", null, "Paste it below. It is saved only on this computer."));
  card.appendChild(steps);
  const key = keyForm(card, function () {
    ov.remove();
    checkStatus();
    if (!status.knowledge_files) {
      openMaterials("Your key works. Next, add your course files (slides, books, homework) so the tutor can answer from them.");
    } else {
      setStatus("Your key works. Ask your first question!", 6000);
    }
  });
  if (status.local_ready) {
    const skip = el("button", "small", "Skip for now (use only the local model)");
    skip.style.marginTop = "6px";
    skip.onclick = function () { ov.remove(); backendEl.value = "local"; store("backend", "local"); };
    card.appendChild(skip);
  }
  ov.appendChild(card);
  document.body.appendChild(ov);
  setTimeout(function () { key.focus(); }, 50);
}

// ---- The app window: tell the server we are still here ----
const PAGE_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
function heartbeat() { fetch("/api/heartbeat", { method: "POST", body: PAGE_ID, keepalive: true }).catch(function () {}); }
heartbeat();
setInterval(heartbeat, 10000);
window.addEventListener("pagehide", function () { navigator.sendBeacon("/api/bye", PAGE_ID); });
window.addEventListener("pageshow", function (e) { if (e.persisted) heartbeat(); });

// In the app window, web links open in the normal browser
document.addEventListener("click", function (e) {
  if (!appMode) return;
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a) return;
  const url = new URL(a.href, location.href);
  if (url.origin === location.origin || !/^https?:$/.test(url.protocol)) return;
  e.preventDefault();
  api("POST", "/api/open-url", { url: url.href }).catch(function () { window.open(url.href, "_blank"); });
});

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

// ---- Buttons, keys and start-up ----
langEl.value = localStorage.getItem("lang") || "auto";
langEl.onchange = function () { localStorage.setItem("lang", langEl.value); };
backendEl.value = localStorage.getItem("backend") || "auto";
backendEl.onchange = async function () {
  localStorage.setItem("backend", backendEl.value);
  const local = backendEl.querySelector('option[value="local"]');
  if (backendEl.value === "local" && local.textContent.indexOf("starts Ollama") >= 0) {
    local.textContent = "Local model (starting Ollama...)";
    try { await api("POST", "/api/local/start"); }
    catch (e) { alert("Could not start Ollama: " + e.message); }
    checkStatus();
  }
};
if (localStorage.getItem("sideCollapsed") === "1") appEl.classList.add("collapsed");

micBtn.innerHTML = ICON.mic;
document.getElementById("hideSide").onclick = toggleSide;
document.getElementById("scrim").onclick = function () { sideEl.classList.remove("open"); };
searchEl.addEventListener("input", renderList);
document.getElementById("theme").onclick = function () {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
                                  : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !modalEl.classList.contains("hidden")) hideModal();
});

sendBtn.onclick = function () { send(); };
micBtn.onclick = toggleMic;
document.getElementById("newChat").onclick = newChat;
document.getElementById("toggleSide").onclick = toggleSide;
document.getElementById("openMaterials").onclick = function () { openMaterials(); };
document.getElementById("openTools").onclick = function () { openTools(); };
document.getElementById("openSettingsBtn").onclick = function () { openSettings(); };
document.getElementById("mclose").onclick = hideModal;
modalEl.onclick = function (e) { if (e.target === modalEl) hideModal(); };
input.addEventListener("input", autosize);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

(async function init() {
  checkStatus().then(function (s) { if (s && !s.has_key) showSetup(s); });
  try {
    const chats = await refreshList();
    const last = localStorage.getItem("lastChat");
    const found = chats.find(function (c) { return c.id === last; });
    if (found) await openChat(found.id);
    else if (chats.length) await openChat(chats[0].id);
    else await newChat();
  } catch (e) {
    setStatus("Could not reach the server: " + e.message);
  }
})();
</script>
